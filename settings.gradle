pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

// ForgeGradle adds its own bundled repository during plugin application.
// Do not use FAIL_ON_PROJECT_REPOS here because it rejects that required repository.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

rootProject.name = 'ComputerStorage'
